# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Lint and
# format rules, plugin versions and modes come from the shared
# sinemacula/coding-standards source; this file wires that source in and points
# the PHP plugins at the packages they need.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.0"

[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# The fixer config builds its rules from the standards package, which the
# sandbox gets from extra_packages rather than a package_file: setting
# package_file makes qlty ignore extra_packages.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.30.0"]

# phpstan runs from a dedicated sandbox file that lists the analysis stack and
# every dependency the analysed code references, so a package the code starts
# to use is added there as well as to composer.json. With no package_filters,
# qlty installs the whole file into the tool sandbox and phpstan resolves the
# framework from there, with no project install or prepare step.
[[plugin]]
name = "phpstan"
package_file = ".qlty/configs/composer.json"
