name: Quality Gates

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        - cron: 0 7 * * 1
    workflow_dispatch:

concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    mutation:
        if: ${{ github.event_name != 'schedule' }}
        name: Mutation / PHP 8.3 / Laravel 13
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.0.1
                with:
                    php-version: 8.3
                    extensions: dom

            -   name: Pin Laravel version
                run: composer update --with="laravel/framework:^13.3" --prefer-dist --no-interaction --no-progress

            -   name: Scoped mutation gate
                run: composer test:mutation

    performance-contracts:
        if: ${{ github.event_name != 'schedule' }}
        name: Performance Contracts / PHP 8.3 / Laravel 13
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.0.1
                with:
                    php-version: 8.3
                    extensions: dom

            -   name: Pin Laravel version
                run: composer update --with="laravel/framework:^13.3" --prefer-dist --no-interaction --no-progress

            -   name: Query/write budget contracts
                run: composer test:perf:contracts

    mutation-full:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        name: Mutation Full / PHP 8.3 / Laravel 13
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.0.1
                with:
                    php-version: 8.3
                    extensions: dom

            -   name: Pin Laravel version
                run: composer update --with="laravel/framework:^13.3" --prefer-dist --no-interaction --no-progress

            -   name: Full mutation suite
                run: composer test:mutation:full

    benchmarks:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        name: Benchmarks / PHP 8.3 / Laravel 13
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.0.1
                with:
                    php-version: 8.3
                    extensions: dom

            -   name: Pin Laravel version
                run: composer update --with="laravel/framework:^13.3" --prefer-dist --no-interaction --no-progress

            -   name: Run PHPBench suite
                run: XDEBUG_MODE=off composer bench:ci

            -   name: Render benchmark summary
                if: ${{ always() }}
                run: php scripts/ci/render-phpbench-summary.php build/phpbench.xml >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload benchmark artifact
                if: ${{ always() }}
                uses: actions/upload-artifact@v4
                with:
                    name: phpbench-report
                    path: build/phpbench.xml
                    if-no-files-found: warn
